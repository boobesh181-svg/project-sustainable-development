name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: windsurf
          POSTGRES_PASSWORD: windsurf_pass
          POSTGRES_DB: windsurf
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U windsurf -d windsurf"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      ENV: test
      APP_TESTING: "1"
      DATABASE_URL: postgresql+asyncpg://windsurf:windsurf_pass@localhost:5432/windsurf
      SECRET_KEY: ci-not-for-production
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "30"
      ENABLE_MRV_INGESTION: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx ruff

      - name: Run Ruff (minimal)
        run: |
          ruff check backend --select E9,F

      - name: Run Alembic migrations
        working-directory: backend
        run: |
          alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: |
          python -m pytest -q

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Build
        working-directory: frontend
        run: |
          npm run lint
          npm run build
